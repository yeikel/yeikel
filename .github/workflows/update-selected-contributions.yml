name: Update profile content

on:
  push:
    branches-ignore:
      - main
    paths:
      - README.md
      - .github/data/highlighted-contributions.json
      - .github/scripts/pyproject.toml
      - .github/scripts/update_selected_contributions.py
      - .github/scripts/uv.lock
      - .github/workflows/update-selected-contributions.yml
      - .github/scripts/tests/test_update_selected_contributions.py
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: .github/scripts/uv.lock

      - name: Run updater tests
        run: >-
          uv run --project .github/scripts --locked
          python -m unittest discover -s .github/scripts/tests -v

  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: .github/scripts/uv.lock

      - name: Update profile content
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: >-
          uv run --project .github/scripts --locked
          python .github/scripts/update_selected_contributions.py README.md

      - name: Commit changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Profile content is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update profile content"
          git push origin "HEAD:${DEFAULT_BRANCH}"
